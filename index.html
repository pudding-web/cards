<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flashcard Review</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #0b1220;
      color: white;
    }


    h1 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 20px;
    }


    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    
    .box {
      width: 250px;
      height: 100px;
      background-color: grey;
      padding: 10px;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      transition: width 0.4s ease;
    }


    .box:hover {
      width: 350px;
    }

    .box span {
      z-index: 1;
    }

    .box::after {
      content: " — Answer shows here";
      position: absolute;
      left: 260px;
      opacity: 0;
      white-space: nowrap;

      transition: opacity 0.4s ease, left 0.4s ease;
    }

    .box:hover::after {
      opacity: 1;
      left: 200px;
    }
  </style>
</head>

<body>

  <h1>Flashcard Review</h1>
  <p>Hover over a box to reveal the answer.</p>

  <div class="container">

    <div class="box"><span>CSS stands for</span></div>
    <div class="box"><span>HTML stands for</span></div>
    <div class="box"><span>:hover does</span></div>
    <div class="box"><span>padding means</span></div>
    <div class="box"><span>margin means</span></div>
    <div class="box"><span>background-color does</span></div>
    <div class="box"><span>transition is used to</span></div>
    <div class="box"><span>display:flex does</span></div>

  </div>

</body>
</html>

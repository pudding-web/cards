<style>
  @keyframes myAnimation {
  
    from { color: orange; }

    to { color: blue; }  
  }
  div p {
    font-size: 1.4em;
    font-weight: bold;
    animation-name: myAnimation;
    animation-duration: 3s;
    animation-iteration-count: infinite;
  }
</style>

<div>
  <p>Color-changing text!</p>
</div>

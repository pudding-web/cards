<!DOCTYPE html>
<html lang="en">
<head>
  <h1 class="title">Flashcard Review</h1>
  <p class="text">
  Hover over the box to reveal the awnser.
</p>


  <meta charset="UTF-8">
  <title>Flashcard Review</title>

  <style>
    .box {
      width: 25%;
      height: 200px;
      background-color: grey;
      padding: 10px;
      margin: 20px
      position: relative;

      display: flex;
      align-items: center;
      justify-content: flex-start;
      color: black;

        margin-left: 20px; 
    }

    .box::after {
      content: "Move your cursor here";
      position: absolute;
      right: -200px;
      opacity: 0;
      white-space: nowrap;
      transition: opacity 0.4s ease, right 0.4s ease;
    }

    .box:hover::after {
      opacity: 1;
      right: -300px;
    }
  </style>
</head>

<body>

  <div class="box">Move your cursor here</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Splash screen -->
  <div class="splash">
    <h1>Review</h1>
    <p>Get ready…</p>
  </div>

  <!-- Main content (already behind the splash) -->
  <main class="main">
    <h2>Flashcards</h2>

    <div class="cards">
      <details class="card">
        <summary class="front">What is 7 × 8?</summary>
        <div class="back">56</div>
      </details>

      <details class="card">
        <summary class="front">CSS stands for?</summary>
        <div class="back">Cascading Style Sheets</div>
      </details>

      <details class="card">
        <summary class="front">Spanish: “I will go”</summary>
        <div class="back">Iré</div>
      </details>
    </div>
  </main>

</body>
</html>

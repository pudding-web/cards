<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flashcard Review</title>

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #0b1220;
      color: white;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 20px;
    }

 
    .splash {
      position: fixed;
      inset: 0;
      background-color: #b6e6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;

      animation: splashFade 2s forwards;
    }

    .splash h2 {
      font-size: 64px;
      color: #003b5c;
      margin: 0;
    }

    @keyframes splashFade {
      0% {
        opacity: 1;
      }
      70% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }


    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .box {
      width: 260px;
      height: 100px;
      background-color: grey;
      padding: 10px;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      transition: width 0.4s ease;
    }

    .box:hover {
      width: 600px;
    }

    .box span {
      z-index: 1;
    }


    .box::after {
      position: absolute;
      left: 280px;
      opacity: 0;
      white-space: nowrap;
      transition: opacity 0.4s ease, left 0.4s ease;
    }


    .box:hover::after {
      opacity: 1;
      left: 230px;
    }


    .css::after {
      content: "Cascading Style Sheets";
    }

    .html::after {
      content: "HyperText Markup Language";
    }

    .hover::after {
      content: "Applies styles when the mouse is over an element";
    }

    .padding::after {
      content: "Space inside an element";
    }

    .margin::after {
      content: "Space outside an element";
    }

    .bg::after {
      content: "Changes the background color";
    }

    .transition::after {
      content: "Smoothly animates style changes";
    }

    .flex::after {
      content: "Helps align and position elements";
    }
  </style>
</head>

<body>


  <div class="splash">
    <h2>Flashcard Review</h2>
  </div>


  <h1>Flashcard Review</h1>
  <p>Hover over a box to reveal the answer.</p>

  <div class="container">
    <div class="box css"><span>CSS stands for</span></div>
    <div class="box html"><span>HTML stands for</span></div>
    <div class="box hover"><span>:hover does</span></div>
    <div class="box padding"><span>padding means</span></div>
    <div class="box margin"><span>margin means</span></div>
    <div class="box bg"><span>background-color does</span></div>
    <div class="box transition"><span>transition is used to</span></div>
    <div class="box flex"><span>display:flex does</span></div>
  </div>

</body>
</html>

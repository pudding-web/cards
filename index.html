<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SPLASH -->
  <div id="splash" class="splash">
    <h1>Review</h1>
    <p>Get ready…</p>
  </div>

  <!-- MAIN PAGE -->
  <main id="main" class="main hidden">
    <h2>Flashcards</h2>

    <div class="cards">
      <div class="card" tabindex="0">
        <div class="card-inner">
          <div class="card-face front">What is 7 × 8?</div>
          <div class="card-face back">56</div>
        </div>
      </div>

      <div class="card" tabindex="0">
        <div class="card-inner">
          <div class="card-face front">CSS stands for?</div>
          <div class="card-face back">Cascading Style Sheets</div>
        </div>
      </div>

      <div class="card" tabindex="0">
        <div class="card-inner">
          <div class="card-face front">Spanish: “I will go”</div>
          <div class="card-face back">Iré</div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
